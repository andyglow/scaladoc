name: Continuous Integration

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build and Test
    strategy:
      matrix:
        os: [ubuntu-latest]
        scala: [2.13.18, 2.12.21, 3.9.0]
        java: [temurin@21]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java (temurin@21)
        if: matrix.java == 'temurin@21'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Install scala-cli
        if: matrix.scala == '2.13.18'
        uses: VirtusLab/scala-cli-setup@v1
        with:
          jvm: 'temurin:21'

      - name: Check that workflows are up to date
        run: sbt '++ ${{ matrix.scala }}; githubWorkflowCheck'

      - name: Build project
        run: sbt '++ ${{ matrix.scala }}; test'

      - name: sbt plugin scripted tests
        if: matrix.scala == '2.13.18'
        run: sbt '++ ${{ matrix.scala }}; +publishLocal; +sbtScaladoc/scripted'

      - name: Gradle plugin, Maven and scala-cli tests
        if: matrix.scala == '2.13.18'
        run: sbt '++ ${{ matrix.scala }}; +publishM2; gradlePluginCheck; mavenCheck; scalaCliCheck'

      - name: Build the documentation site
        if: matrix.scala == '2.13.18'
        run: sbt '++ ${{ matrix.scala }}; docs/makeSite'

      - name: Measure coverage
        if: matrix.scala == '2.13.18'
        run: sbt '++ ${{ matrix.scala }}; coverage; coreJVM/test; parserJVM/test; coverageAggregate'

      - name: Upload coverage to Codecov
        if: matrix.scala == '2.13.18'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/out/jvm/scala-2.13.18/scaladoc-root/coverage-report/cobertura.xml
          fail_ci_if_error: true
